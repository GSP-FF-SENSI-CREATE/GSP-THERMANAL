
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSP THERMAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#080e1b;color:#fff;
 font-family:Arial,sans-serif;padding:18px;
}
header{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:25px;
}
.logo{font-size:23px;font-weight:bold;color:#38bdf8}
.status{color:#4ade80;font-size:12px}
h2{font-size:14px;color:#94a3b8;margin-bottom:12px}
.hero{
 background:linear-gradient(145deg,#142b48,#101827);
 border:1px solid #23456a;border-radius:22px;
 padding:24px;text-align:center;margin-bottom:20px;
 box-shadow:0 10px 35px #0008;
}
.temp{font-size:58px;font-weight:bold;color:#38bdf8}
.hero p{color:#94a3b8;font-size:13px;margin-top:8px}
.grid{
 display:grid;grid-template-columns:1fr 1fr;
 gap:12px;margin-bottom:22px;
}
.card{
 background:#111d30;border:1px solid #253b58;
 border-radius:17px;padding:18px;
}
.card small{color:#94a3b8}
.value{font-size:25px;font-weight:bold;margin-top:12px}
.blue{color:#38bdf8}
.green{color:#4ade80}
.orange{color:#fb923c}
button{
 background:#0ea5e9;color:white;border:0;
 padding:12px 15px;border-radius:12px;
 font-weight:bold;cursor:pointer;
}
.controls{display:flex;gap:10px;flex-wrap:wrap}
canvas{
 width:100%;height:160px;background:#111d30;
 border-radius:15px;margin:12px 0 22px;
}
.float{
 position:fixed;right:15px;bottom:90px;
 background:#142b48;border:2px solid #38bdf8;
 padding:13px;border-radius:50%;
 box-shadow:0 0 20px #0ea5e966;
 font-weight:bold;color:#38bdf8;
}
.bar{
 display:none;position:fixed;top:8px;left:5%;
 width:90%;background:#142b48;
 border:1px solid #38bdf8;border-radius:12px;
 padding:12px;text-align:center;
}
footer{text-align:center;color:#64748b;font-size:12px;padding:25px}
</style>
</head>
<body>

<header>
 <div class="logo">⚡ GSP THERMAL</div>
 <div class="status">● DEMO MODE</div>
</header>

<div class="hero">
 <h2>PHONE TEMPERATURE</h2>
 <div class="temp" id="mainTemp">36.8°C</div>
 <p id="condition">DEMO DATA · NORMAL</p>
</div>

<div class="grid">
 <div class="card">
  <small>🔋 BATTERY TEMP</small>
  <div class="value blue" id="battery">36.8°C</div>
 </div>
 <div class="card">
  <small>⚙️ CPU TEMP</small>
  <div class="value orange">Unavailable</div>
 </div>
 <div class="card">
  <small>🎮 GPU TEMP</small>
  <div class="value orange">Unavailable</div>
 </div>
 <div class="card">
  <small>🧠 RAM USAGE</small>
  <div class="value green">Unavailable</div>
 </div>
</div>

<h2>TEMPERATURE HISTORY</h2>
<canvas id="chart" width="600" height="160"></canvas>

<h2>FLOATING MONITOR</h2>
<div class="controls">
 <button onclick="toggleBubble()">Bubble ON/OFF</button>
 <button onclick="toggleBar()">Bar ON/OFF</button>
</div>

<div class="float" id="bubble">37°</div>
<div class="bar" id="bar">⚡ GSP THERMAL · 36.8°C · DEMO</div>

<footer>
GSP THERMAL © 2026<br>
Phone Temperature Monitoring Dashboard
</footer>

<script>
let temp=36.8;
let history=[];

function update(){
 temp=Number((36+Math.random()*2).toFixed(1));

 document.getElementById("mainTemp").innerText=temp+"°C";
 document.getElementById("battery").innerText=temp+"°C";
 document.getElementById("bubble").innerText=temp+"°";
 document.getElementById("bar").innerText=
 "⚡ GSP THERMAL · "+temp+"°C · DEMO";

 document.getElementById("condition").innerText=
 "DEMO DATA · "+(temp>37.5?"WARM":"NORMAL");

 history.push(temp);
 if(history.length>30)history.shift();
 draw();
}

function draw(){
 let c=document.getElementById("chart");
 let ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);
 ctx.strokeStyle="#38bdf8";
 ctx.lineWidth=4;
 ctx.beginPath();

 history.forEach((v,i)=>{
  let x=i*(c.width/29);
  let y=130-(v-35)*35;
  if(i===0)ctx.moveTo(x,y);
  else ctx.lineTo(x,y);
 });
 ctx.stroke();
}

function toggleBubble(){
 let b=document.getElementById("bubble");
 b.style.display=b.style.display==="none"?"block":"none";
}
function toggleBar(){
 let b=document.getElementById("bar");
 b.style.display=b.style.display==="block"?"none":"block";
}

document.getElementById("bubble").style.display="none";
setInterval(update,2000);
update();
</script>
</body>
</html>
